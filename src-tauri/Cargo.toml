[package]
name = "gongwen-writer"
version = "0.1.0"
description = "mac 本地公文材料写作助手"
authors = ["Gongwen Writer"]
edition = "2021"

[lib]
name = "gongwen_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
